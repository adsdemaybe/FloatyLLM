name: lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  comment-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Forbid multiline comments
        run: python3 tools/lint_comments.py src tools
