name: build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  cuda-build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.5.1-devel-ubuntu22.04
    steps:
      - name: Install cmake + git
        run: apt-get update && apt-get install -y cmake git
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_CUDA_ARCHITECTURES=75
      - name: Compile (device code compiles without a GPU present)
        run: cmake --build build -j
